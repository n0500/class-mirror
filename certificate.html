<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="مرآة الصف">
<title>شهادة تميز — مرآة الصف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
@page{size:A4 landscape;margin:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:#d9dfe6;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;color:#1d2e28;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:14px 16px}
.bar button{min-height:44px;padding:8px 22px;border:0;border-radius:12px;background:#0d3b2f;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.bar button:disabled{opacity:.5;cursor:wait}
.bar .hint{align-self:center;font-size:13px;color:#4a5a54}
.viewport{padding:0 16px 24px;overflow:hidden}
.scaler{transform-origin:top right;width:297mm;margin-inline:auto}

.sheet{position:relative;width:297mm;height:210mm;padding:9mm;background:linear-gradient(135deg,#7c4a12 0%,#d49a3a 16%,#f6d68a 30%,#b87a22 46%,#eec06a 62%,#9a5f17 80%,#e2b45a 100%);box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.inner{position:relative;font-family:"Cairo","IBM Plex Sans Arabic",Tahoma,sans-serif;height:100%;border-radius:6mm;background:radial-gradient(90% 70% at 50% 35%,#fffdf8 0%,#fbf8f1 55%,#f4ecd9 100%);box-shadow:inset 0 0 0 .6mm #8f5a18,inset 0 0 0 2.2mm #fbf8f1,inset 0 0 0 2.6mm #c9973f;padding:10mm 24mm 9mm;text-align:center;display:flex;flex-direction:column;align-items:center}
/* زخارف الزوايا */
.corner{position:absolute;width:22mm;height:22mm;border:.7mm solid #c9973f}
.corner.tr{top:6mm;right:6mm;border-left:0;border-bottom:0;border-top-right-radius:6mm}
.corner.tl{top:6mm;left:6mm;border-right:0;border-bottom:0;border-top-left-radius:6mm}
.corner.br{bottom:6mm;right:6mm;border-left:0;border-top:0;border-bottom-right-radius:6mm}
.corner.bl{bottom:6mm;left:6mm;border-right:0;border-top:0;border-bottom-left-radius:6mm}
/* نقش المرآة الخفيف في الخلفية */
.arch{position:absolute;left:50%;top:18mm;width:120mm;height:170mm;transform:translateX(-50%);border:1mm solid rgba(201,151,63,.13);border-radius:60mm 60mm 8mm 8mm/70mm 70mm 8mm 8mm;pointer-events:none}

.crest{width:38mm;height:auto;filter:drop-shadow(0 .4mm .4mm rgba(60,35,5,.3))}
.school{margin:2mm 0 0;font-size:5mm;font-weight:700;color:#26352f}
.title{margin:0;font-family:"Cairo",Tahoma,sans-serif;font-weight:800;font-size:15mm;line-height:1.4;background:linear-gradient(180deg,#b27a22,#7c4a12 60%,#a8701f);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{display:inline-block;margin:1mm 0 0;padding:1.4mm 10mm;border:.4mm solid #c9973f;border-radius:4mm;background:#fdf9ef;font-weight:700;font-size:7.2mm;line-height:1.5;color:#0d3b2f}
.body{margin:3mm 0 0;max-width:220mm;font-size:5.4mm;font-weight:500;line-height:1.75;color:#1d2e28}
.cls{display:inline-block;margin:1mm 0;padding:0 8mm;font-family:"Cairo",Tahoma,sans-serif;font-weight:800;font-size:10.5mm;line-height:1.5;color:#0d3b2f;border-bottom:.6mm solid #c9973f}
.stat{margin:3mm 0 0;display:inline-flex;align-items:center;gap:3mm;padding:2mm 7mm;border-radius:99mm;background:#e7f4ec;color:#1f7a45;font-weight:700;font-size:5.6mm}
.stat svg{width:5.5mm;height:5.5mm;color:#d99a1e}
.sigs{margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:flex-end;padding:0 8mm}
.sig{width:62mm;text-align:center;font-size:5.2mm;font-weight:700;color:#26352f}
.sig .ln{height:12mm;border-bottom:.35mm dashed #9a6a1c;margin-bottom:2mm}
.seal{width:24mm;height:24mm;margin-bottom:4mm;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#f6d68a 0%,#d49a3a 60%,#9a5f17 100%);box-shadow:0 0 0 1mm #fbf8f1,0 0 0 1.5mm #c9973f;color:#5a3408;font-weight:700;font-size:4.4mm;line-height:1.3}
.seal span{display:block;font-size:3.3mm;font-weight:700}
.rights{font-family:"IBM Plex Sans Arabic",sans-serif;position:absolute;bottom:2.4mm;left:0;right:0;text-align:center;font-size:2.6mm;color:#7a6a4a}
.err{max-width:520px;margin:40px auto;padding:20px;border-radius:14px;background:#fff;text-align:center}

/* شهادة أسبوعية مستقلة لكل فصل فائز، مع بيانات الأسبوع والمرحلة. */
.weekly .sheet+.sheet{margin-top:24px}
.weekly .inner{padding:7mm 18mm 7mm}
.weekly .crest{width:24mm}
.education{margin:1mm 0 0;font-size:3.5mm;line-height:1.5;font-weight:600;color:#4a5a54}
.weekly .school{font-size:4.4mm;line-height:1.5;margin:1mm 0 0}
.weekly .title{font-size:12mm;line-height:1.35;margin:1mm 0;color:#9a6a1c;background:none}
.weekly .sub{font-size:6mm;line-height:1.5;padding:1mm 8mm;margin:0}
.award-stage{font-size:4.2mm;font-weight:700;color:#0d3b2f;margin:1mm 0 0;line-height:1.5}
.weekly .body{font-size:4.7mm;line-height:1.55;max-width:235mm;margin:2mm 0 0}
.weekly .cls{font-size:10mm;line-height:1.4;margin:1mm 0}
.weekly .stat{font-size:4.8mm;margin:2mm 0 0;padding:1.5mm 6mm}
.award-period{max-width:235mm;font-size:3.9mm;line-height:1.6;color:#4a5a54;margin:2mm 0 0}
.weekly .sigs{padding:0 5mm}
.weekly .sig{font-size:4.5mm}
.weekly .sig .ln{height:7mm}
.weekly .seal{width:20mm;height:20mm;margin-bottom:1mm;font-size:3.8mm}

@media print{
  body{background:none}
  .bar{display:none}
  .viewport{padding:0;overflow:visible}
  .scaler{transform:none!important;width:auto;height:auto!important}
  .sheet{box-shadow:none}
  .weekly .sheet{break-after:page;page-break-after:always;break-inside:avoid;page-break-inside:avoid;margin:0!important}
  .weekly .sheet:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<div class="bar"><button id="print">طباعة الشهادة</button><span class="hint" id="printHint">يرجى اختيار الاتجاه الأفقي وتفعيل «رسومات الخلفية» في نافذة الطباعة.</span></div>
<div class="err" id="certificateStatus" role="status" hidden></div>
<div class="viewport"><div class="scaler" id="scaler">
<div class="sheet" id="sheet">
  <div class="inner">
    <span class="corner tr"></span><span class="corner tl"></span><span class="corner br"></span><span class="corner bl"></span>
    <div class="arch" aria-hidden="true"></div>
    <img class="crest" src="assets/crest.png" alt="">
    <p class="education" data-field="education" hidden>وزارة التعليم | إدارة التعليم بمنطقة القصيم</p>
    <p class="school" id="school" data-field="school"></p>
    <div class="title">شهادة تميز</div>
    <div class="sub" id="kind" data-field="kind">الفصل الأكثر تقدما</div>
    <p class="award-stage" data-field="stage" hidden></p>
    <div class="body">
      تتقدم إدارة <span id="school2" data-field="school2"></span><br>بخالص الشكر والتقدير إلى طالبات فصل<br>
      <span class="cls" id="cls" data-field="cls"></span><br>
      <span id="reason" data-field="reason"></span>
    </div>
    <div class="stat" id="stat" data-field="stat" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6l2.85 5.8 6.4.93-4.63 4.5 1.1 6.37L12 17.2l-5.72 3 1.1-6.37-4.63-4.5 6.4-.93z"/></svg><span id="statTxt" data-field="statTxt"></span></div>
    <p class="award-period" data-field="period" hidden></p>
    <div class="sigs">
      <div class="sig"><div class="ln"></div>منسقة المبادرة</div>
      <div class="seal"><div>مرآة الصف<span id="sealMonth" data-field="sealMonth"></span></div></div>
      <div class="sig"><div class="ln"></div>مديرة المدرسة</div>
    </div>
    <div class="rights">فكرة وتصميم: أ. نهى فالح المطيري © 2026</div>
  </div>
</div>
</div></div>

<script src="config.js"></script>
<script src="assets/common.js"></script>
<script src="assets/weekly-awards.js"></script>
<script>
(function () {
  var M = window.Miraat, q = new URLSearchParams(location.search);
  var $ = function (id) { return document.getElementById(id); };
  var num = new Intl.NumberFormat("ar-SA-u-nu-latn");
  if (q.get("mode") === "weekly") { loadWeekly(); return; }
  var c = M.findClass(q.get("c"));
  if (!c) { document.body.innerHTML = '<div class="err">رابط الشهادة غير مكتمل. يرجى فتح الشهادة من لوحة المتابعة ← «شهادة الفصل الأكثر تقدما».</div>'; return; }
  var month = q.get("m") || M.hijriMonthLabel(M.hijriMonthRange(-1).start);
  var mode = q.get("mode") === "excellence" ? "excellence" : "progress";
  var from = parseInt(q.get("from"), 10), to = parseInt(q.get("to"), 10);

  $("school").textContent = M.SCHOOL;
  $("school2").textContent = M.SCHOOL;
  $("cls").textContent = c.name;
  $("sealMonth").textContent = month.replace(/\s*هـ$/, "");
  if (mode === "progress") {
    $("kind").textContent = "الفصل الأكثر تقدما";
    $("reason").innerHTML = "بمناسبة نيل الفصل لقب «" + $("kind").textContent + "» لشهر <span style=\"white-space:nowrap\">" + month.replace(/[<>&]/g, "").replace(/\s+هـ$/, "هـ") + "</span>، مع أطيب التمنيات بدوام التميز والتوفيق.";
    if (!isNaN(from) && !isNaN(to) && to > from) { $("statTxt").textContent = "ارتفعت نسبة الحصص المتميزة من " + num.format(from) + "٪ إلى " + num.format(to) + "٪"; $("stat").hidden = false; }
  } else {
    $("kind").textContent = "الفصل الأكثر تميزا";
    $("reason").innerHTML = "بمناسبة نيل الفصل لقب «" + $("kind").textContent + "» لشهر <span style=\"white-space:nowrap\">" + month.replace(/[<>&]/g, "").replace(/\s+هـ$/, "هـ") + "</span>، مع أطيب التمنيات بدوام التميز والتوفيق.";
    if (!isNaN(to) && to > 0) { $("statTxt").textContent = "بلغت نسبة الحصص المتميزة " + num.format(to) + "٪"; $("stat").hidden = false; }
  }
  document.title = "شهادة " + $("kind").textContent + " — " + c.name;

  /* ملاءمة المعاينة لعرض الشاشة */
  function scale() {
    var s = $("scaler"), avail = s.parentNode.clientWidth, w = $("sheet").offsetWidth, k = Math.min(1, avail / w);
    s.style.transform = "scale(" + k + ")";
    s.style.transformOrigin = "top " + (k < 1 ? "right" : "center");
    s.style.height = ($("sheet").offsetHeight * k) + "px";
    if (k < 1) s.style.marginInline = "0";
  }
  addEventListener("resize", scale); scale();
  bindPrint();

  function bindPrint() {
    $("print").addEventListener("click", function () {
      if (this.disabled) return;
      var imgs = Array.prototype.slice.call(document.images).map(function (i) { return i.complete ? 0 : new Promise(function (r) { i.onload = i.onerror = r; }); });
      Promise.all(imgs.concat(document.fonts ? [document.fonts.ready] : [])).then(function () { window.print(); });
    });
  }

  function weeklyError(message) {
    $("scaler").hidden = true;
    $("print").hidden = true;
    $("printHint").hidden = true;
    $("certificateStatus").hidden = false;
    $("certificateStatus").textContent = message;
    document.title = "شهادات تكريم الأسبوع — مرآة الصف";
  }
  function fillWeekly(sheet, x, b) {
    var A = M.WeeklyAwards;
    var field = function (name) { return sheet.querySelector('[data-field="' + name + '"]'); };
    field("education").hidden = false;
    field("school").textContent = field("school2").textContent = M.SCHOOL;
    field("kind").textContent = "الفصل الأكثر تميزا هذا الأسبوع";
    field("stage").textContent = "على مستوى " + x.stage.name;
    field("stage").hidden = false;
    field("cls").textContent = x.c.name;
    var tied = A.winners(b, x.stage.id).length > 1;
    field("reason").textContent = "تقديرا لجهودكن وحصول الفصل على " + (tied ? "أعلى رصيد مشترك" : "أعلى رصيد") + " من الحصص المتميزة على مستوى " + x.stage.name + " ضمن مبادرة مرآة الصف. مع أطيب التمنيات بدوام التميز والتوفيق.";
    field("statTxt").textContent = "رصيد الفصل: " + A.countLabel(x.n);
    field("stat").hidden = false;
    field("period").textContent = "الأسبوع: " + A.periodLabel(b);
    field("period").hidden = false;
    field("sealMonth").textContent = "تميز الأسبوع";
  }
  function scaleWeekly() {
    var s = $("scaler"); if (s.hidden) return;
    var sheets = Array.prototype.slice.call(s.querySelectorAll(".sheet"));
    var k = Math.min(1, s.parentNode.clientWidth / sheets[0].offsetWidth);
    var h = sheets.reduce(function (sum, sheet) { return sum + sheet.offsetHeight; }, 0) + Math.max(0, sheets.length - 1) * 24;
    s.style.transform = "scale(" + k + ")";
    s.style.transformOrigin = "top " + (k < 1 ? "right" : "center");
    s.style.height = h * k + "px";
    s.style.marginInline = k < 1 ? "0" : "auto";
  }
  function loadWeekly() {
    var A = M.WeeklyAwards;
    document.body.classList.add("weekly");
    document.title = "شهادات تكريم الأسبوع — مرآة الصف";
    $("scaler").hidden = true;
    $("print").disabled = true;
    $("print").textContent = "طباعة / حفظ PDF";
    $("printHint").textContent = "شهادة لكل فصل على A4 أفقي. اختاري «حفظ بصيغة PDF» أو الطابعة، وفعلي رسومات الخلفية.";
    $("certificateStatus").hidden = false;
    $("certificateStatus").textContent = "جار تجهيز الشهادات من نتائج الأسبوع المنشورة…";
    bindPrint();
    M.Store.getBoard().then(function (b) {
      if (!A.validBoard(b)) { weeklyError("لم تنشر نتائج أسبوع مكتمل بعد. افتحي لوحة المتابعة وحدثي أرقام انعكاس الأسبوع."); return; }
      var requestedWeek = q.get("week");
      if ((requestedWeek && requestedWeek !== b.weekStart) || (!requestedWeek && q.get("scope") !== "all")) { weeklyError("رابط الشهادة يخص أسبوعا مختلفا عن المعروض الآن. أعيدي إصدار الشهادة من تبويب انعكاس الأسبوع في لوحة المتابعة."); return; }
      var list = A.allWinners(b), code = q.get("c");
      if (code) {
        var c = M.findClass(code);
        list = c ? list.filter(function (x) { return x.c.code === c.code; }) : [];
      } else if (q.get("scope") !== "all") {
        weeklyError("رابط الشهادة غير مكتمل. افتحي الشهادة من تبويب انعكاس الأسبوع في لوحة المتابعة."); return;
      }
      if (!list.length) { weeklyError("لا توجد شهادة لهذا الفصل أو الأسبوع، لأن التكريم يعتمد على أعلى رصيد موجب من الحصص المتميزة في كل مرحلة."); return; }
      var first = $("sheet"), template = first.cloneNode(true), scaler = $("scaler");
      list.forEach(function (x, i) {
        var sheet = i === 0 ? first : template.cloneNode(true);
        if (i > 0) {
          sheet.removeAttribute("id");
          sheet.querySelectorAll("[id]").forEach(function (el) { el.removeAttribute("id"); });
          scaler.appendChild(sheet);
        }
        fillWeekly(sheet, x, b);
      });
      $("certificateStatus").hidden = true;
      scaler.hidden = false;
      $("print").disabled = false;
      document.title = (list.length === 1 ? "شهادة الفصل الأكثر تميزا — " + list[0].c.name : "شهادات الفصول الأكثر تميزا") + " — " + b.weekStart;
      addEventListener("resize", scaleWeekly); scaleWeekly();
      if (document.fonts) document.fonts.ready.then(scaleWeekly);
    }).catch(function () { weeklyError("تعذر تحميل نتائج الأسبوع. تحققي من الاتصال بالإنترنت وأعيدي فتح الشهادة."); });
  }
})();
</script>
</body>
</html>
