<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>بطاقات الفصول — مرآة الصف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
@page{size:A4 portrait;margin:0}
body{background:#ebe6db}
.toolbar{max-width:980px;margin:18px auto;padding:16px 18px;background:#fff;border-radius:18px;border:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toolbar h1{margin:0;font-size:21px;color:var(--green-800)}
.toolbar p{margin:4px 0 0;color:var(--muted);font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools select{min-height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:15px}
.tools button{min-height:46px;border:0;background:var(--green-700);color:#fff;padding:0 20px;border-radius:12px;font-size:16px;font-weight:700}
.tools a{display:inline-flex;align-items:center;min-height:46px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);color:var(--green-700);font-weight:600;text-decoration:none;background:#fff}
.cards{max-width:980px;margin:0 auto;padding:0 14px 40px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.sheet{background:#fff;border-radius:18px;padding:14px;display:flex;justify-content:center}
.sheet svg{width:100%;max-width:420px;height:auto;display:block}
.sheet[hidden]{display:none}
@media(max-width:680px){.cards{grid-template-columns:1fr}}
@media print{
  body{background:#fff}
  .toolbar{display:none}
  .cards{display:block;padding:0;margin:0;max-width:none}
  .sheet{width:210mm;height:297mm;padding:13.5mm 15mm;border-radius:0;background:#fff;align-items:center;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  .sheet svg{width:180mm;height:270mm;max-width:none}
}
</style>
</head>
<body>
<div class="toolbar">
  <div><h1>بطاقات الفصول</h1><p>بطاقة مستقلة بمقاس A4 لكل فصل، ولكل بطاقة رمز QR يفتح رابط الفصل مباشرة.</p></div>
  <div class="tools">
    <label class="sr" for="only">الفصل</label>
    <select id="only"><option value="">جميع الفصول (20 بطاقة)</option></select>
    <button type="button" id="printBtn">طباعة / حفظ PDF</button>
    <a href="dashboard.html">لوحة المتابعة</a>
  </div>
</div>
<main class="cards" id="cards"></main>

<script src="config.js"></script>
<script src="assets/common.js"></script>
<script src="assets/qrcode.js"></script>
<script>
(function () {
  var M = window.Miraat;
  var base = location.href.split("#")[0].split("?")[0].replace(/[^\/]*$/, "");

  function qrPath(text) {
    var q = new QRCodeLib.QRCode(-1, QRCodeLib.ECL.H);
    q.addData(text); q.make();
    var n = q.getModuleCount(), d = "";
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += "M" + c + " " + r + "h1v1h-1z";
    return { n: n, d: d };
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  /* التصميم: صورة المرآة (1024×1536) مع رمز QR واسم الفصل فوقها */
  var BG = "assets/mirror-card.jpg";
  var html = "";
  M.CLASSES.forEach(function (cls) {
    var url = base + "?c=" + cls.code;
    var q = qrPath(url), quiet = 3;
    var x = 383, y = 800, box = 258, pad = 10;           /* موضع الرمز داخل الإطار الذهبي */
    var scale = (box - pad * 2) / (q.n + quiet * 2);
    html += '<section class="sheet" data-c="' + cls.code + '">' +
      '<svg viewBox="0 0 1024 1536" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="بطاقة ' + esc(cls.name) + '">' +
      '<defs><linearGradient id="pl-' + cls.code + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f5ee"/><stop offset="1" stop-color="#f6f3ec"/></linearGradient></defs>' +
      '<image href="' + BG + '" x="0" y="0" width="1024" height="1536" preserveAspectRatio="xMidYMid slice"/>' +
      '<rect x="' + x + '" y="' + y + '" width="' + box + '" height="' + box + '" rx="6" fill="#fff"/>' +
      '<g transform="translate(' + (x + pad) + " " + (y + pad) + ") scale(" + scale + ") translate(" + quiet + " " + quiet + ')"><path d="' + q.d + '" fill="#111" shape-rendering="crispEdges"/></g>' +
      '<rect x="392" y="1154" width="240" height="72" rx="10" fill="url(#pl-' + cls.code + ')"/>' +
      '<text x="512" y="1205" text-anchor="middle" font-family="IBM Plex Sans Arabic, Tahoma, Arial, sans-serif" font-size="44" font-weight="700" fill="#0e3a30">' + esc(cls.name) + "</text>" +
      "</svg></section>";
    var o = document.createElement("option"); o.value = cls.code; o.textContent = cls.name;
    document.getElementById("only").appendChild(o);
  });
  document.getElementById("cards").innerHTML = html;

  document.getElementById("printBtn").addEventListener("click", function () {
    var img = new Image(); img.onload = img.onerror = function () { (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { window.print(); }); };
    img.src = BG;
  });
  document.getElementById("only").addEventListener("change", function () {
    var v = this.value;
    document.querySelectorAll(".sheet").forEach(function (s) { s.hidden = !!v && s.getAttribute("data-c") !== v; });
  });
})();
</script>
</body>
</html>
