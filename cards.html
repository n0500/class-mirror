<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>بطاقات الفصول — مرآة الصف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
@page{size:A4 portrait;margin:0}
body{background:#ebe6db}
.toolbar{max-width:980px;margin:18px auto;padding:16px 18px;background:#fff;border-radius:18px;border:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toolbar h1{margin:0;font-size:21px;color:var(--green-800)}
.toolbar p{margin:4px 0 0;color:var(--muted);font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools select{min-height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:15px}
.tools button{min-height:46px;border:0;background:var(--green-700);color:#fff;padding:0 20px;border-radius:12px;font-size:16px;font-weight:700}
.tools a{display:inline-flex;align-items:center;min-height:46px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);color:var(--green-700);font-weight:600;text-decoration:none;background:#fff}
.cards{max-width:980px;margin:0 auto;padding:0 14px 40px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.sheet{background:#fbf8f2;border-radius:18px;padding:14px;display:flex;justify-content:center}
.sheet svg{width:100%;max-width:420px;height:auto;display:block}
.sheet[hidden]{display:none}
@media(max-width:680px){.cards{grid-template-columns:1fr}}
@media print{
  body{background:#fff}
  .toolbar{display:none}
  .cards{display:block;padding:0;margin:0;max-width:none}
  .sheet{width:210mm;height:297mm;padding:13.5mm 15mm;border-radius:0;background:#fff;align-items:center;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  .sheet svg{width:180mm;height:270mm;max-width:none}
}
</style>
</head>
<body>
<div class="toolbar">
  <div><h1>بطاقات الفصول</h1><p>بطاقة مستقلة بمقاس A4 لكل فصل، ولكل بطاقة رمز QR يفتح رابط الفصل مباشرة.</p></div>
  <div class="tools">
    <label class="sr" for="only">الفصل</label>
    <select id="only"><option value="">جميع الفصول (20 بطاقة)</option></select>
    <button type="button" onclick="window.print()">طباعة / حفظ PDF</button>
    <a href="dashboard.html">لوحة المتابعة</a>
  </div>
</div>
<main class="cards" id="cards"></main>

<script src="config.js"></script>
<script src="assets/common.js"></script>
<script src="assets/qrcode.js"></script>
<script>
(function () {
  var M = window.Miraat;
  var base = location.href.split("#")[0].split("?")[0].replace(/[^\/]*$/, "");

  function qrPath(text) {
    var q = new QRCodeLib.QRCode(-1, QRCodeLib.ECL.H);
    q.addData(text); q.make();
    var n = q.getModuleCount(), d = "";
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += "M" + c + " " + r + "h1v1h-1z";
    return { n: n, d: d };
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  var DESIGN = `
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f4ed"/><stop offset="1" stop-color="#eee8dc"/></linearGradient>
  <radialGradient id="mirror" cx="46%" cy="25%" r="78%"><stop offset="0" stop-color="#fffdf8"/><stop offset=".55" stop-color="#f6f2e9"/><stop offset="1" stop-color="#e9e2d5"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f4210"/><stop offset=".18" stop-color="#d69b3a"/><stop offset=".42" stop-color="#f1c56d"/><stop offset=".62" stop-color="#a96513"/><stop offset=".82" stop-color="#e3b255"/><stop offset="1" stop-color="#754413"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#5a431e" flood-opacity=".24"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
  <clipPath id="clip"><ellipse cx="512" cy="770" rx="391" ry="666"/></clipPath>
</defs>
<rect width="1024" height="1536" fill="url(#bg)"/>
<ellipse cx="512" cy="770" rx="426" ry="706" fill="url(#gold)" stroke="#5d360d" stroke-width="8" filter="url(#shadow)"/>
<ellipse cx="512" cy="770" rx="406" ry="686" fill="#c98a2f" stroke="#f0c66d" stroke-width="7"/>
<ellipse cx="512" cy="770" rx="394" ry="674" fill="url(#mirror)" stroke="#71420e" stroke-width="5"/>
<g fill="url(#gold)" stroke="#68400f" stroke-width="5"><path d="M430 92 C430 55 458 31 484 54 C491 20 533 20 540 54 C566 31 594 55 594 92 C564 82 545 92 512 118 C479 92 460 82 430 92Z"/><path d="M458 82 C470 55 494 58 512 84 C530 58 554 55 566 82 C548 80 533 92 512 108 C491 92 476 80 458 82Z"/><circle cx="512" cy="58" r="17"/></g>
<g transform="translate(0 1540) scale(1 -1)" fill="url(#gold)" stroke="#68400f" stroke-width="5"><path d="M430 92 C430 55 458 31 484 54 C491 20 533 20 540 54 C566 31 594 55 594 92 C564 82 545 92 512 118 C479 92 460 82 430 92Z"/><path d="M458 82 C470 55 494 58 512 84 C530 58 554 55 566 82 C548 80 533 92 512 108 C491 92 476 80 458 82Z"/><circle cx="512" cy="58" r="17"/></g>
<g clip-path="url(#clip)" filter="url(#blur)" opacity=".28"><rect x="140" y="360" width="230" height="360" rx="10" fill="#dff2fb" stroke="#718995" stroke-width="14"/><line x1="255" y1="360" x2="255" y2="720" stroke="#8298a2" stroke-width="10"/><line x1="140" y1="535" x2="370" y2="535" stroke="#8298a2" stroke-width="10"/><rect x="675" y="430" width="250" height="270" rx="10" fill="#edf1f1" stroke="#697a80" stroke-width="15"/><g fill="#5a88b5"><rect x="120" y="1010" width="240" height="68" rx="16"/><rect x="392" y="960" width="235" height="68" rx="16"/><rect x="665" y="1015" width="230" height="68" rx="16"/><rect x="215" y="1180" width="250" height="68" rx="16"/><rect x="575" y="1170" width="250" height="68" rx="16"/></g><g stroke="#56728a" stroke-width="18"><line x1="155" y1="1075" x2="150" y2="1260"/><line x1="325" y1="1075" x2="335" y2="1260"/><line x1="430" y1="1025" x2="425" y2="1210"/><line x1="590" y1="1025" x2="600" y2="1210"/><line x1="700" y1="1080" x2="695" y2="1260"/><line x1="860" y1="1080" x2="870" y2="1260"/></g></g>
<g fill="#0a5448" text-anchor="middle" font-family="IBM Plex Sans Arabic, Tahoma, Arial, sans-serif"><text x="512" y="206" font-size="31" font-weight="700">وزارة التعليم</text><text x="512" y="254" font-size="29" font-weight="700">إدارة التعليم بمنطقة القصيم</text><text x="512" y="297" font-size="29" font-weight="700">المتوسطة الرابعة والثانوية الثانية بالرس</text><line x1="320" y1="350" x2="472" y2="350" stroke="#b18335" stroke-width="3"/><path d="M512 339 L523 350 L512 361 L501 350 Z" fill="#b18335"/><line x1="552" y1="350" x2="704" y2="350" stroke="#b18335" stroke-width="3"/><text x="512" y="505" font-size="98" font-weight="900">مرآة الصف</text><path d="M512 548 C485 520 455 553 512 603 C569 553 539 520 512 548Z" fill="none" stroke="#0a5448" stroke-width="9"/><text x="512" y="670" font-size="39" font-weight="800">معلمتنا.. شاركينا انعكاس الحصة</text><path d="M350 735 h55 M350 735 v55 M674 735 h-55 M674 735 v55 M350 1005 h55 M350 1005 v-55 M674 1005 h-55 M674 1005 v-55" fill="none" stroke="#b18335" stroke-width="7" stroke-linecap="round"/><text x="512" y="1068" font-size="27" font-weight="700">امسحي الرمز وسجّلي تقييمك</text><line x1="376" y1="1122" x2="470" y2="1122" stroke="#b18335" stroke-width="3"/><path d="M512 1112 L522 1122 L512 1132 L502 1122 Z" fill="#b18335"/><line x1="554" y1="1122" x2="648" y2="1122" stroke="#b18335" stroke-width="3"/><rect x="300" y="1160" width="424" height="150" rx="42" fill="#faf6ed" stroke="#b18335" stroke-width="5"/><text x="512" y="1205" font-size="27" font-weight="700">الفصل</text><text x="512" y="1382" font-size="30" font-weight="700">معًا.. نصنع أثرًا أجمل</text></g>`;

  var html = "";
  M.CLASSES.forEach(function (cls) {
    var url = base + "?c=" + cls.code;
    var q = qrPath(url), size = 236, quiet = 4, box = size + 24;
    var scale = size / (q.n + quiet * 2);
    var x = 512 - box / 2, y = 870 - box / 2;
    html += '<section class="sheet" data-c="' + cls.code + '">' +
      '<svg viewBox="0 0 1024 1536" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="بطاقة ' + esc(cls.name) + '">' + DESIGN +
      '<rect x="' + x + '" y="' + y + '" width="' + box + '" height="' + box + '" rx="10" fill="#fff"/>' +
      '<g transform="translate(' + (x + 12) + " " + (y + 12) + ") scale(" + scale + ") translate(" + quiet + " " + quiet + ')"><path d="' + q.d + '" fill="#0d2f27" shape-rendering="crispEdges"/></g>' +
      '<text x="512" y="1272" text-anchor="middle" font-family="IBM Plex Sans Arabic, Tahoma, Arial, sans-serif" font-size="50" font-weight="700" fill="#0a5448">' + esc(cls.name) + "</text>" +
      "</svg></section>";
    var o = document.createElement("option"); o.value = cls.code; o.textContent = cls.name;
    document.getElementById("only").appendChild(o);
  });
  document.getElementById("cards").innerHTML = html;

  document.getElementById("only").addEventListener("change", function () {
    var v = this.value;
    document.querySelectorAll(".sheet").forEach(function (s) { s.hidden = !!v && s.getAttribute("data-c") !== v; });
  });
})();
</script>
</body>
</html>
